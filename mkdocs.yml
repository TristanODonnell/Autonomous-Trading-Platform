site_name: Retail Autonomous Trading Platform
repo_url: https://github.com/TristanODonnell/Autonomous-Trading-Platform
repo_name: TristanODonnell/Autonomous-Trading-Platform

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - codehilite

nav:
  - Home: index.md
  - Contracts: contracts/index.md
  - Ingestion: ingestion/index.md
  - Runtime: runtime/index.md
  - Safety: safety/index.md
  - Storage: storage/index.md
  - Universe: universe/index.md
  - Paper Validation: paper-validation/index.md
  - Vertical Slice: vertical-slice/index.md
  - Research: research/index.md
