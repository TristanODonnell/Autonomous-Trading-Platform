name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env for CI
        run: |
          cp infra/.env.example infra/.env

      - name: Start Postgres
        run: docker compose -f docker-compose.yml up -d postgres

      - name: Wait for Postgres
        run: |
          until docker exec ratp_postgres pg_isready -U ratp -d ratp; do
            sleep 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://ratp:ratp_password@localhost:5433/ratp
          TRADING_ENVIRONMENT: paper
          PAPER_BROKER_API_KEY: ci-paper-key
          PAPER_BROKER_API_SECRET: ci-paper-secret
        run: python -m pytest -m "not external"

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  external-alpaca-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Alpaca external smoke tests
        env:
          APP_ENV: external-smoke
          DATABASE_URL: postgresql+psycopg://ratp:ratp_password@localhost:5433/ratp
          TRADING_ENVIRONMENT: paper
          NO_LIVE_TRADING: "true"
          ENABLE_LIVE_TRADING: "false"
          INCLUDE_LIVE_MODULES: "false"
          ALPACA_EXTERNAL_SMOKE_ENABLED: "true"
          PAPER_BROKER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          PAPER_BROKER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          ALPACA_SMOKE_SYMBOL: ${{ vars.ALPACA_SMOKE_SYMBOL || 'AAPL' }}
        run: python -m pytest tests/external/alpaca -m "external and alpaca and smoke"
