# scenario:
#   name: safety_with_recovery
#   purpose: >
#     Cross-domain: emergency safety halt followed by operator recovery sequence.
#     Tests that a halt mid-replay correctly blocks trading, that settings and
#     governance are updated during the halt window, and that resume restores
#     normal operation with updated state.
#     Test questions:
#       - Does the halt at 2024-01-18 block the trading cycle?
#       - Do settings changes during the halt (2024-01-22) apply despite being paused?
#       - Does governance transition during halt (2024-01-23) apply?
#       - Does the release at 2024-01-25 restore trading with updated settings?
#   expected_behavior: >
#     safety_emergency_halt at 2024-01-18. Conservative settings patched at 2024-01-22.
#     Governance transition at 2024-01-23. Release at 2024-01-25.
#     Final state: trading active, conservative settings, updated governance.
#   recommended_use: integration
#
# Command:
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/interactions/safety_with_recovery.yaml \
#     --output artifacts/platform/backtests/safety_with_recovery.json

platform_replay:
  name: safety_with_recovery
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL]
  start: 2024-01-02
  end: 2024-02-15
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: true
    rebalance_frequency: daily
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1]
  governance:
    - strategy_id: momentum_v1
      state: paper_trading_active
    - strategy_id: mean_reversion_v1
      state: paper_trading_active
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.50"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.50"
  universe: {}
  datasets: {}

scheduled_jobs:
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  trading_cycle:
    cadence: daily
    enabled: true
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  universe:
    cadence: monthly      # ~2 rotations over 2 months
    enabled: true
  research:
    cadence: monthly      # ~2 experiment runs over 2 months
    enabled: true
  dashboard_snapshot:
    cadence: daily
    enabled: true

timeline_events:
  # Week 3: emergency halt triggered (e.g. unexpected correlated drawdown)
  - at: 2024-01-18
    type: safety_emergency_halt
    reason: correlated drawdown across both strategies exceeded threshold; emergency halt

  # During halt: operator dials down risk settings before resuming
  - at: 2024-01-22
    type: settings_changed
    patch:
      risk_tolerance: low
      max_drawdown_limit: "0.08"
      auto_promote_enabled: false
    reason: operator reducing risk parameters before releasing halt

  # During halt: suspend underperforming strategy via governance
  - at: 2024-01-23
    type: governance_manual_transition
    strategy_id: momentum_v1
    to_state: suspended
    reason: operator suspending momentum_v1 pending root-cause review of drawdown

  # Release halt — resuming with conservative settings and reduced active strategies
  - at: 2024-01-25
    type: safety_release_halt
    reason: root cause identified and addressed; releasing halt with conservative config

  # Week 6: restore momentum_v1 after full review
  - at: 2024-02-12
    type: governance_manual_transition
    strategy_id: momentum_v1
    to_state: approved_for_paper_trading
    reason: root cause resolved; restoring momentum_v1 to paper trading evaluation

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: true
  write_failure_report: true
  write_dashboard_snapshot: true
