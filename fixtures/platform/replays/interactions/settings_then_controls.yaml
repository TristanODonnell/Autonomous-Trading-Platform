# scenario:
#   name: settings_then_controls
#   purpose: >
#     Cross-domain interaction: operator shifts settings to aggressive, then
#     pauses trading after observing unexpected behavior, then resumes with
#     conservative settings. Tests that the settings state at pause time is
#     preserved and that resumption picks up the new conservative config.
#     Test questions:
#       - Does aggressive risk_tolerance apply on and after 2024-01-10?
#       - Does the pause on 2024-01-17 block the trading cycle?
#       - Does the conservative settings patch on 2024-01-22 apply before resume?
#       - Does resumption on 2024-01-24 see conservative settings?
#   expected_behavior: >
#     3 settings events + 1 pause + 1 resume in timeline_events_applied.
#     Final state: trading active, risk_tolerance=conservative.
#   recommended_use: integration
#
# Command:
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/interactions/settings_then_controls.yaml \
#     --output artifacts/platform/backtests/settings_then_controls.json

platform_replay:
  name: settings_then_controls
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL]
  start: 2024-01-02
  end: 2024-02-29
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: true
    rebalance_frequency: daily
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.50"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.50"
  universe: {}
  datasets: {}

scheduled_jobs:
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  trading_cycle:
    cadence: daily
    enabled: true
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  universe:
    cadence: monthly      # ~2 rotations over 2 months
    enabled: true
  research:
    cadence: monthly      # ~2 experiment runs over 2 months
    enabled: true
  dashboard_snapshot:
    cadence: daily
    enabled: true

timeline_events:
  # Week 2: operator shifts to aggressive
  - at: 2024-01-10
    type: settings_changed
    patch:
      risk_tolerance: high
      max_drawdown_limit: "0.25"
    reason: operator shifted to aggressive posture for Q1 momentum

  # Week 3: unexpected drawdown spike → operator pauses to review
  - at: 2024-01-17
    type: controls_paused
    reason: unexpected drawdown spike; operator paused trading for review

  # Still paused; operator also pushes conservative settings before resuming
  - at: 2024-01-22
    type: settings_changed
    patch:
      risk_tolerance: low
      max_drawdown_limit: "0.08"
      auto_promote_enabled: false
    reason: operator dialing risk back to conservative before resuming

  # Week 4: operator resumes with new conservative config in place
  - at: 2024-01-24
    type: controls_resumed
    reason: review complete; resuming with conservative settings

  # Week 6: operator restores moderate settings after stable period
  - at: 2024-02-12
    type: settings_changed
    patch:
      risk_tolerance: medium
      max_drawdown_limit: "0.15"
      auto_promote_enabled: true
    reason: stable two-week period; restoring moderate risk posture

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: true
  write_failure_report: false
  write_dashboard_snapshot: true
