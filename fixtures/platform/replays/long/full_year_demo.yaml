# scenario:
#   name: full_year_demo
#   purpose: >
#     Full calendar year 2024 replay. ~261 trading days. Demonstrates the complete
#     platform lifecycle running autonomously: research generates strategies monthly,
#     governance promotes survivors, quality-based reallocation shifts capital over
#     time, and the drawdown ladder self-manages risk without manual intervention.
#   recommended_use: storytelling demo, stakeholder replay, pre-release regression

# Command:
#   atp platform backtest plan \
#     --fixture fixtures/platform/replays/long/full_year_demo.yaml
#
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/long/full_year_demo.yaml \
#     --output artifacts/platform/backtests/full_year_demo.json

platform_replay:
  name: full_year_demo
  mode: historical_backtest

  # Data universe — ingestion pulls bars for all of these.
  # Universe rotation (monthly) then selects the best subset to actually trade,
  # using the prior month's performance data. First rotation fires on tick 1.
  symbols:
    # Broad market / macro
    - SPY   # S&P 500
    - QQQ   # Nasdaq 100
    - IWM   # Russell 2000 small-cap
    - GLD   # Gold
    - TLT   # Long-duration treasuries
    # Large-cap tech
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    # Large-cap non-tech
    - JPM   # Financials
    - JNJ   # Healthcare
    - XOM   # Energy
    - WMT   # Consumer staples

  start: 2024-01-02
  end: 2024-12-31
  starting_cash: 1000000
  random_seed: 2024
  # cadence_minutes omitted = 390 = one full trading day per tick (~261 ticks)

# ── Initial state ────────────────────────────────────────────────────────────
# Seeded once before tick 1. Everything after this is system-driven.
initial_state:

  settings:
    # ── Risk posture ─────────────────────────────────────────────────────────
    # risk_tolerance: label used in UI/audit log ("low" | "medium" | "high")
    risk_tolerance: medium

    # Portfolio-level: halt new orders if portfolio drops >12% from its peak.
    # Code default is 10% — we use 12% for moderate headroom during drawdowns.
    max_drawdown_limit: "0.12"

    # Per-strategy: auto-demote a strategy if it pulls back >15% from its own peak.
    # AutoDemotionService evaluates this daily.
    max_strategy_drawdown: "0.15"

    # Max allocation to any single strategy (concentration cap).
    # Code default is 25%. 35% gives top-performing strategies room to grow.
    per_strategy_cap: "0.35"

    # Target portfolio annualised volatility for risk-budgeting calculations.
    # Code default is 15%. Moderate = keep it at 15%.
    target_portfolio_volatility: "0.15"

    # ── Governance automation ─────────────────────────────────────────────────
    # Allow AutoPromotionService to promote strategies through research → paper
    # without manual sign-off. Code default is False (safe for live); True here
    # so the demo shows the full autonomous promotion pipeline.
    auto_promote_enabled: true

    # Allow QualityBasedReallocationService to shift capital between strategies
    # as quality scores diverge. Code default is False. Must be True for the
    # allocation story to be visible in the equity curve.
    auto_rebalance_enabled: true

    # ── Rebalance stability ───────────────────────────────────────────────────
    # Only rebalance once per week at most (hysteresis cadence).
    # Code default is weekly. "daily" causes noisy churn; weekly is the right
    # level for a month-long quality signal horizon.
    rebalance_frequency: weekly

    # Minimum hours between two rebalance events (interval guard).
    # 168h = one week. Prevents rapid allocation oscillation.
    min_rebalance_interval_hours: "168"

    # Minimum absolute allocation change required to trigger a rebalance.
    # 2% dead-band: small quality drifts don't generate unnecessary turnover.
    min_allocation_change_pct: "0.02"

  # ── Seed strategies ────────────────────────────────────────────────────────
  # Three strategies pre-approved for paper trading on day 1.
  # Research runs monthly and seeds additional strategies through governance;
  # by month 2 there will be 20-50+ strategies in the pipeline.
  governance:
    - strategy_id: momentum_v1
      state: approved_for_paper_trading
    - strategy_id: mean_reversion_v1
      state: approved_for_paper_trading
    - strategy_id: macd_crossover_v1
      state: approved_for_paper_trading

  # Equal-weight starting allocation.
  # Quality-based reallocation will drift these as performance diverges over time.
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.34"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.33"
    - strategy_id: macd_crossover_v1
      allocation_pct: "0.33"

# ── Scheduled jobs ────────────────────────────────────────────────────────────
# Cadences: daily | per_tick | after_ingestion | weekly | biweekly | monthly
scheduled_jobs:
  ingestion:          { cadence: daily,           enabled: true }
  corporate_actions:  { cadence: daily,           enabled: true }
  features:           { cadence: after_ingestion, enabled: true }
  trading_cycle:      { cadence: daily,           enabled: true }
  risk:               { cadence: daily,           enabled: true }
  governance:         { cadence: daily,           enabled: true }
  portfolio_snapshot: { cadence: daily,           enabled: true }
  operations_health:  { cadence: daily,           enabled: true }
  universe:           { cadence: monthly,         enabled: true }  # ~12 rotations
  research:           { cadence: monthly,         enabled: true }  # ~12 pipeline runs

# No timeline_events block.
# If the kill switch fires → drawdown governance triggered it.
# If a strategy is demoted → AutoDemotionService caught a breach.
# If allocations shift → QualityBasedReallocationService scored a divergence.
# Everything is system-driven from day 1.

# ── Outputs ───────────────────────────────────────────────────────────────────
outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: true
  write_failure_report: false
  write_dashboard_snapshot: true
