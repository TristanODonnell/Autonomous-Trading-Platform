# scenario:
#   name: smoke_portfolio_mode
#   purpose: >
#     5-day smoke test for portfolio mode (rotation step 1D). Three paper-approved
#     strategies run in the same trading cycle, each sized from its own budget and
#     diffed against its own sleeve.
#   expected_behavior: >
#     All three strategies are ACTIVE from the first tick. Order intents and fills
#     carry each strategy's own id. Sleeve snapshots exist per strategy per tick, and
#     the sleeve-vs-account reconciliation reports no mismatches.
#   recommended_use: smoke
#
# Run against a clean backtest state (wipes backtest tables in DATABASE_URL):
#   python scripts/reset_backtest_state.py
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/short/smoke_portfolio_mode.yaml \
#     --output artifacts/platform/backtests/smoke_portfolio_mode.json

platform_replay:
  name: smoke_portfolio_mode
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL, MSFT]
  start: 2024-01-02
  end: 2024-01-08
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: false
    rebalance_frequency: daily
    # Portfolio mode: every active strategy trades its own sleeve.
    portfolio_mode_enabled: true
    min_active_strategies: 3
    max_active_strategies: 6
    max_total_strategy_allocation_pct: 0.95
    per_strategy_cap: 0.5
    # Never let a smoke run halt on a drawdown breach.
    portfolio_drawdown_action: warn_only
    portfolio_drawdown_recovery_mode: auto_resume
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1, macd_crossover_v1]
  governance:
    - strategy_id: momentum_v1
      state: approved_for_paper_trading
    - strategy_id: mean_reversion_v1
      state: approved_for_paper_trading
    - strategy_id: macd_crossover_v1
      state: approved_for_paper_trading
  allocations: []
  universe: {}
  datasets: {}

scheduled_jobs:
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  trading_cycle:
    cadence: daily
    enabled: true
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  universe:
    cadence: weekly
    enabled: true
  research:
    cadence: monthly
    enabled: false
  dashboard_snapshot:
    cadence: daily
    enabled: false

timeline_events: []

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: false
  write_failure_report: false
  write_dashboard_snapshot: false
