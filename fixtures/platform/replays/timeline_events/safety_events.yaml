# scenario:
#   name: safety_events
#   purpose: >
#     Validate safety_emergency_halt and safety_release_halt events.
#     Tests that a simulated emergency halt applies before the trading cycle
#     on the same tick and that the release restores normal operation.
#     Test questions:
#       - Is kill_switch_enabled=true in the tick on 2024-01-16?
#       - Does the trading cycle on 2024-01-16 report cycle_blocked?
#       - Is kill_switch_enabled=false after 2024-01-19?
#       - Are both events in timeline_events_applied?
#   expected_behavior: >
#     safety_emergency_halt at 2024-01-16. safety_release_halt at 2024-01-19.
#     Final safety summary: kill_switch_enabled=false, gate_ok=true.
#   recommended_use: event_validation
#
# NOTE: Safety events interact with the kill switch service.
#   Verify the safety hook applies the halt before the trading cycle runs.
#
# Command:
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/timeline_events/safety_events.yaml \
#     --output artifacts/platform/backtests/safety_events.json
#
#   Check: cat artifacts/platform/backtests/safety_events.json | \
#     jq '.safety, .timeline_events_applied'

platform_replay:
  name: safety_events
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL]
  start: 2024-01-02
  end: 2024-01-31
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: true
    rebalance_frequency: daily
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.50"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.50"
  universe: {}
  datasets: {}

scheduled_jobs:
  # Daily after-close pipeline
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  # Market-hours trading
  trading_cycle:
    cadence: daily
    enabled: true
  # EOD evaluation
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  # Slower cadence
  universe:
    cadence: monthly      # fires once at start of Jan — 1 rotation
    enabled: true
  research:
    cadence: monthly      # fires once at start of Jan — 1 experiment run
    enabled: true
  dashboard_snapshot:
    cadence: daily
    enabled: true

timeline_events:
  # Simulated emergency halt mid-month (e.g. unexpected macro event)
  - at: 2024-01-16
    type: safety_emergency_halt
    reason: simulated emergency halt triggered by macro volatility event

  # Release halt after 3-day review window
  - at: 2024-01-19
    type: safety_release_halt
    reason: macro event resolved; safety review complete; halt released

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: false
  write_failure_report: true
  write_dashboard_snapshot: false
