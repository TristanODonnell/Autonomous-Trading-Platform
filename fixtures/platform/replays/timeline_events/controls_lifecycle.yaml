# scenario:
#   name: controls_lifecycle
#   purpose: >
#     Validate controls_paused and controls_resumed events. Confirms the runner
#     applies pause state before the trading cycle on the same tick.
#     Test questions:
#       - Is trading_paused=true in the tick on 2024-01-12?
#       - Does the trading cycle on 2024-01-12 report cycle_blocked?
#       - Is trading_paused=false restored on 2024-01-16?
#       - Are both events in timeline_events_applied with correct status?
#   expected_behavior: >
#     controls_paused applied 2024-01-12, controls_resumed applied 2024-01-16.
#     4 ticks between pause and resume show blocked trading cycle.
#     Final controls summary: trading_paused=false.
#   recommended_use: event_validation
#
# Command:
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/timeline_events/controls_lifecycle.yaml \
#     --output artifacts/platform/backtests/controls_lifecycle.json
#
#   Check: cat artifacts/platform/backtests/controls_lifecycle.json | \
#     jq '[.tick_results[] | {date: .tick_date, paused: .trading.cycle_blocked}]'

platform_replay:
  name: controls_lifecycle
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL]
  start: 2024-01-02
  end: 2024-01-31
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: true
    rebalance_frequency: daily
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.50"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.50"
  universe: {}
  datasets: {}

scheduled_jobs:
  # Daily after-close pipeline
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  # Market-hours trading
  trading_cycle:
    cadence: daily
    enabled: true
  # EOD evaluation
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  # Slower cadence
  universe:
    cadence: monthly      # fires once at start of Jan — 1 rotation
    enabled: true
  research:
    cadence: monthly      # fires once at start of Jan — 1 experiment run
    enabled: true
  dashboard_snapshot:
    cadence: daily
    enabled: true

timeline_events:
  # Pause all trading on 2024-01-12 for a 4-day review window
  - at: 2024-01-12
    type: controls_paused
    reason: operator paused trading for mid-month portfolio review

  # Resume trading on 2024-01-16 (after weekend)
  - at: 2024-01-16
    type: controls_resumed
    reason: operator resumed trading after portfolio review completed

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: false
  write_failure_report: false
  write_dashboard_snapshot: false
