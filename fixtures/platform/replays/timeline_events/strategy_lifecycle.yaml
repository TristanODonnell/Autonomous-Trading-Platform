# scenario:
#   name: strategy_lifecycle
#   purpose: >
#     Validate strategy_disabled and strategy_enabled events applied to a specific
#     strategy_id. Tests that the runner correctly routes to the controls hook
#     with the right strategy_id and that downstream cycles reflect the change.
#     Test questions:
#       - Is momentum_v1 disabled on 2024-01-10?
#       - Does the trading cycle on 2024-01-10 exclude momentum_v1 signals?
#       - Is momentum_v1 re-enabled on 2024-01-22?
#       - Does the controls summary show the disabled period?
#   expected_behavior: >
#     strategy_disabled(momentum_v1) at 2024-01-10. strategy_enabled(momentum_v1)
#     at 2024-01-22. Controls summary shows disabled_strategies empty at end.
#   recommended_use: event_validation
#
# Command:
#   atp platform backtest run \
#     --fixture fixtures/platform/replays/timeline_events/strategy_lifecycle.yaml \
#     --output artifacts/platform/backtests/strategy_lifecycle.json

platform_replay:
  name: strategy_lifecycle
  mode: historical_backtest
  symbols: [SPY, QQQ, AAPL]
  start: 2024-01-02
  end: 2024-01-31
  starting_cash: 100000
  random_seed: 42

initial_state:
  settings:
    risk_tolerance: medium
    max_drawdown_limit: "0.15"
    auto_promote_enabled: true
    rebalance_frequency: daily
  controls:
    trading_mode: paper
    kill_switch_active: false
  strategies: [momentum_v1, mean_reversion_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "0.50"
    - strategy_id: mean_reversion_v1
      allocation_pct: "0.50"
  universe: {}
  datasets: {}

scheduled_jobs:
  # Daily after-close pipeline
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: true
  features:
    cadence: after_ingestion
    enabled: true
  # Market-hours trading
  trading_cycle:
    cadence: daily
    enabled: true
  # EOD evaluation
  risk:
    cadence: daily
    enabled: true
  governance:
    cadence: daily
    enabled: true
  portfolio_snapshot:
    cadence: daily
    enabled: true
  operations_health:
    cadence: daily
    enabled: true
  # Slower cadence
  universe:
    cadence: monthly      # fires once at start of Jan — 1 rotation
    enabled: true
  research:
    cadence: monthly      # fires once at start of Jan — 1 experiment run
    enabled: true
  dashboard_snapshot:
    cadence: daily
    enabled: true

timeline_events:
  # Disable momentum_v1 after first full week — simulating operator response to underperformance
  - at: 2024-01-10
    type: strategy_disabled
    strategy_id: momentum_v1
    reason: underperforming relative to mean_reversion_v1 in first week; disabling for review

  # Re-enable after two weeks — simulating operator decision to restore
  - at: 2024-01-22
    type: strategy_enabled
    strategy_id: momentum_v1
    reason: review complete; momentum_v1 re-enabled with revised parameters

outputs:
  write_event_log: true
  write_equity_curve: true
  write_portfolio_snapshots: true
  write_governance_audit: true
  write_failure_report: false
  write_dashboard_snapshot: false
