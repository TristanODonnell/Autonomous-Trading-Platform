# scenario:
#   name: research_planted_controls_noise40
#   purpose: >
#     The planted controls' noise sample (research plan, section 5, "The planted
#     controls"): the first controls run (2026-11-26) let one noise seed of five
#     through every stage, too few to say how often the gates pass a strategy
#     with no edge. This runs 40 noise controls to measure that rate. The same
#     job as research_planted_controls.yaml, with `noise_seeds: 40`.
#   expected_behavior: >
#     Research fires once, on the first tick, with the baseline's windows. Its
#     candidates are the three oracles (accuracy 0.60, 0.55, 0.52, seed 1, kept
#     as a check that the run itself works) and 40 noise controls (accuracy
#     0.50, seeds 101 to 140, none of the five already seen). Nothing is
#     generated. The summary's `controls_report` gives each control against its
#     outcome and `noise_pass_rate`: the share of the 40 that passed every
#     stage, with its exact 95% range, plus each stage's pass rate. The bar,
#     fixed by the user 2026-11-26 before the run: at most 2 of the 40 may pass
#     every stage (5%; `noise_within_bar`); 3 or more, and the gates are
#     tightened before G10. The oracles at 0.60 and 0.55 should pass again, as
#     a check on the run itself. No control
#     is seeded into governance. No simulation_runs row ends on or after
#     2026-05-18.
#   cost_notes: >
#     The first controls run (8 controls) took 7 min 43 s, peak 1.48 of 2.98
#     GiB. 43 controls: estimated 30 to 60 minutes (most noise ends at stage 1;
#     a noise control that passes it costs the later stages). Sample the job
#     container's memory while it runs; exit 137 means the ceiling was reached.
#   needs: >
#     As research_admission_baseline.yaml: its two datasets exist on Box B
#     only, and the dates must stay on or after the holdout date and on or
#     before the dataset's last day.
#   recommended_use: worker box, by hand; one job at a time

# Command (Box B):
#   infra/ops/worker_job.sh worker run #     --fixture fixtures/platform/replays/medium/research_planted_controls_noise40.yaml #     --name research_planted_controls_noise40

platform_replay:
  name: research_planted_controls_noise40
  mode: historical_backtest

  symbols: [SPY]

  start: 2026-11-16
  end: 2026-11-18
  starting_cash: 50000
  random_seed: 1

initial_state:
  settings: {}
  controls: {}
  strategies: [momentum_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "1.00"
  universe: {}
  datasets: {}

scheduled_jobs:
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: false
  features:
    cadence: after_ingestion
    enabled: true
  trading_cycle:
    cadence: daily
    enabled: true
  risk:
    cadence: daily
    enabled: false
  governance:
    cadence: daily
    enabled: false
  portfolio_snapshot:
    cadence: daily
    enabled: false
  operations_health:
    cadence: daily
    enabled: false
  universe:
    cadence: monthly
    enabled: false
  research:
    cadence: monthly
    enabled: true
    options:
      profile: full
      candidates: planted_controls
      noise_seeds: 40
      window_layout: admission
      dataset_version: raw_bars_20261118T234501Z_043e50ad
      universe_timeline: universe_timeline_20261119T220329Z_54a0ff84
  dashboard_snapshot:
    cadence: daily
    enabled: false

timeline_events: []

outputs:
  write_event_log: true
  write_equity_curve: false
  write_portfolio_snapshots: false
  write_governance_audit: false
  write_failure_report: false
  write_dashboard_snapshot: false
