# scenario:
#   name: research_planted_controls
#   purpose: >
#     The planted controls (research plan, top board "Planted controls, M1",
#     decided by the user 2026-11-25): does the pipeline find an edge it was
#     given on purpose, and reject one it was not? The same job as
#     research_admission_baseline.yaml (full profile, admission layout, the
#     24-month dataset and the exported universe timeline, the same dates), with
#     the planted controls in place of the month's draw.
#   expected_behavior: >
#     Research fires once, on the first tick, with the baseline's windows. Its
#     candidates are the eight controls of research/pipeline/controls_report.py
#     (PLANTED_CONTROLS): the noisy next-session oracle at accuracy 0.60, 0.55
#     and 0.52 (seed 1), and at 0.50 under seeds 11 to 15 (noise). Nothing is
#     generated. The step's summary carries `controls_report`: each control
#     against the outcome fixed before the run (0.60 and 0.55 pass every stage
#     and beat buy and hold on the holdout; 0.52 report only; no noise seed
#     passes every stage), plus each stage's pass rate over the noise seeds.
#     No control is seeded into governance (`controls_withheld_from_governance`
#     counts the ones held back). No simulation_runs row ends on or after
#     2026-05-18.
#   cost_notes: >
#     Not measured. Eight candidates, about two trades a day per name held; the
#     controls' settings are not tunable, so the neighbour stage builds no
#     neighbours. Estimated from the 2026-11-25 run (33 candidates, 6 h 32 min,
#     of which 3 h 29 min neighbours): 1 to 2 hours. Sample the job
#     container's memory while it runs; exit 137 means the ceiling was reached.
#   needs: >
#     As research_admission_baseline.yaml: its two datasets exist on Box B
#     only, and the dates must stay on or after the holdout date and on or
#     before the dataset's last day.
#   recommended_use: worker box, by hand; one job at a time

# Command (Box B):
#   infra/ops/worker_job.sh worker run \
#     --fixture fixtures/platform/replays/medium/research_planted_controls.yaml \
#     --name research_planted_controls

platform_replay:
  name: research_planted_controls
  mode: historical_backtest

  symbols: [SPY]

  start: 2026-11-16
  end: 2026-11-18
  starting_cash: 50000
  random_seed: 1

initial_state:
  settings: {}
  controls: {}
  strategies: [momentum_v1]
  governance: []
  allocations:
    - strategy_id: momentum_v1
      allocation_pct: "1.00"
  universe: {}
  datasets: {}

scheduled_jobs:
  ingestion:
    cadence: daily
    enabled: true
  corporate_actions:
    cadence: daily
    enabled: false
  features:
    cadence: after_ingestion
    enabled: true
  trading_cycle:
    cadence: daily
    enabled: true
  risk:
    cadence: daily
    enabled: false
  governance:
    cadence: daily
    enabled: false
  portfolio_snapshot:
    cadence: daily
    enabled: false
  operations_health:
    cadence: daily
    enabled: false
  universe:
    cadence: monthly
    enabled: false
  research:
    cadence: monthly
    enabled: true
    options:
      profile: full
      candidates: planted_controls
      window_layout: admission
      dataset_version: raw_bars_20261118T234501Z_043e50ad
      universe_timeline: universe_timeline_20261119T220329Z_54a0ff84
  dashboard_snapshot:
    cadence: daily
    enabled: false

timeline_events: []

outputs:
  write_event_log: true
  write_equity_curve: false
  write_portfolio_snapshots: false
  write_governance_audit: false
  write_failure_report: false
  write_dashboard_snapshot: false
