services:
  postgres:
    image: postgres:16
    container_name: ratp_postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - ratp_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratp -d ratp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ratp_pgdata:
