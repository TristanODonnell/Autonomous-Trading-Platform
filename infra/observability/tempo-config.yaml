server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Tempo 3.0 (grafana/otel-lgtm 0.33+) removed the compactor block; a config that still has
# it fails to parse and the whole LGTM container restart-loops. Retention lives in overrides.
overrides:
  defaults:
    compaction:
      block_retention: 168h
