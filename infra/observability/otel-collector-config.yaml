receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  probabilistic_sampler:
    sampling_percentage: 100

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic

  otlphttp/tempo:
    endpoint: http://lgtm:4318

  otlp_http/loki:
    endpoint: http://lgtm:3100/otlp

  prometheus:
    endpoint: 0.0.0.0:9464

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, probabilistic_sampler, batch ]
      exporters: [ debug, otlphttp/tempo ]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/loki]
