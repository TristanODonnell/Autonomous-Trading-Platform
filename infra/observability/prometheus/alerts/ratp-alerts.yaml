groups:
  - name: ratp-runtime-alerts
    interval: 30s
    rules:
      - alert: RATPTradingCycleFailure
        expr: sum by (environment, component, failure_class) (increase(ratp_trading_cycle_failures_total{deployment_environment!="backtest"}[10m])) > 0
        for: 2m
        labels:
          severity: critical
          category: runtime
          job_name: trading_cycle
        annotations:
          summary: Trading cycle failures detected
          description: "Trading cycle failures have been observed for {{ $labels.component }} in {{ $labels.environment }}."
          recommended_action: Review runtime job failures, Tempo traces, and Loki logs before resuming trading.
      - alert: RATPTradingCycleDegraded
        expr: sum by (environment, component) (increase(ratp_trading_cycle_degraded_total{deployment_environment!="backtest"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
          category: runtime
          job_name: trading_cycle
        annotations:
          summary: Trading cycle is degraded
          description: "Degraded trading-cycle outcomes are sustained for {{ $labels.component }} in {{ $labels.environment }}."
          recommended_action: Inspect runtime state and recent step logs.
      # Heartbeat rules (pre-launch plan 1.4). The scheduler exports the market state, so
      # these stay quiet overnight and at weekends instead of firing on absent samples.
      - alert: RATPSchedulerDown
        expr: absent(ratp_scheduler_heartbeat_timestamp_seconds{deployment_environment!="backtest"}) or (time() - max(ratp_scheduler_heartbeat_timestamp_seconds{deployment_environment!="backtest"})) > 600
        for: 5m
        labels:
          severity: critical
          category: runtime
          job_name: scheduler
        annotations:
          summary: Scheduler heartbeat missing
          description: The soak-loop scheduler has not reported a loop iteration for 10 minutes.
          recommended_action: Check the ratp_scheduler container (docker compose ps / logs) and OTLP export.
      - alert: RATPTradingCycleStale
        expr: max(ratp_market_open{deployment_environment!="backtest"}) == 1 and (time() - max(ratp_trading_cycle_last_success_timestamp_seconds{deployment_environment!="backtest"})) > 900
        for: 2m
        labels:
          severity: critical
          category: runtime
          job_name: trading_cycle
        annotations:
          summary: No trading cycle in 15 minutes during market hours
          description: The market is open and no intraday tick has completed for 15 minutes.
          recommended_action: Check runtime_job_runs for paper_trading_intraday_tick failures, then broker and ingestion health.
      - alert: RATPEodChainOverdue
        expr: max(ratp_eod_chain_overdue{deployment_environment!="backtest"}) == 1
        for: 5m
        labels:
          severity: critical
          category: runtime
          job_name: paper_trading_eod_maintenance
        annotations:
          summary: End-of-day chain not finished by 19:00 ET
          description: The end-of-day chain has not completed for today's session (not started, interrupted, or failed on a blocking step).
          recommended_action: Inspect runtime_job_runs / runtime_job_run_steps for today's paper_trading_eod_maintenance parent and its steps.
      - alert: RATPIngestionLagHigh
        expr: ratp_ingestion_lag_seconds{deployment_environment!="backtest"} > 900
        for: 10m
        labels:
          severity: warning
          category: runtime
          job_name: ingestion_readiness
        annotations:
          summary: Ingestion lag is high
          description: Ingestion lag has exceeded 15 minutes.
          recommended_action: Inspect ingestion readiness jobs and market data source health.

  - name: ratp-broker-alerts
    interval: 30s
    rules:
      - alert: RATPBrokerApiFailureRateHigh
        expr: sum by (environment, component, broker, endpoint) (rate(ratp_broker_api_failures_total{deployment_environment!="backtest"}[5m])) / clamp_min(sum by (environment, component, broker, endpoint) (rate(ratp_broker_api_requests_total{deployment_environment!="backtest"}[5m])), 0.001) > 0.1
        for: 5m
        labels:
          severity: critical
          category: broker
        annotations:
          summary: Broker API failure rate is high
          description: "Broker {{ $labels.broker }} endpoint {{ $labels.endpoint }} has sustained API failures."
          recommended_action: Check broker status, credentials, and request traces before submitting orders.
      - alert: RATPBrokerLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, environment, component, broker, endpoint) (rate(ratp_broker_api_latency_seconds_bucket{deployment_environment!="backtest"}[5m]))) > 3
        for: 10m
        labels:
          severity: warning
          category: broker
        annotations:
          summary: Broker API latency p95 is elevated
          description: "Broker {{ $labels.broker }} endpoint {{ $labels.endpoint }} p95 latency is above 3 seconds."
          recommended_action: Inspect broker operations dashboard and order submission traces.
      - alert: RATPBrokerRetryStorm
        expr: sum by (environment, component, broker, endpoint) (rate(ratp_broker_api_retries_total{deployment_environment!="backtest"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          category: broker
        annotations:
          summary: Broker retry storm detected
          description: "Retry rate is elevated for {{ $labels.broker }} {{ $labels.endpoint }}."
          recommended_action: Consider pausing order submission if retries continue.
      - alert: RATPOrderRiskRejectionsHigh
        expr: sum by (environment, component, strategy_id) (increase(ratp_order_submission_risk_rejection_count_total{deployment_environment!="backtest"}[15m])) > 5
        for: 5m
        labels:
          severity: warning
          category: broker
          job_name: order_submission
        annotations:
          summary: Excessive order risk rejections
          description: "Order submission risk rejections are elevated for {{ $labels.strategy_id }}."
          recommended_action: Inspect risk limits and strategy control state.

  - name: ratp-reconciliation-alerts
    interval: 30s
    rules:
      - alert: RATPUnreconciledOpenOrders
        expr: ratp_unreconciled_orders{deployment_environment!="backtest"} > 0
        for: 10m
        labels:
          severity: critical
          category: reconciliation
        annotations:
          summary: Unreconciled open orders detected
          description: Platform-open orders are absent from broker open-order state.
          recommended_action: Review reconciliation snapshots before additional order submission.
      - alert: RATPDuplicateFillsDetected
        expr: sum by (environment, component, broker, endpoint, status) (increase(ratp_duplicate_fills_detected_total{deployment_environment!="backtest"}[10m])) > 0
        for: 2m
        labels:
          severity: critical
          category: reconciliation
        annotations:
          summary: Duplicate fills detected
          description: Duplicate fill evidence was emitted by reconciliation.
          recommended_action: Freeze trading if duplicate fills are confirmed.
      - alert: RATPCashDriftCritical
        expr: abs(histogram_quantile(0.95, sum by (le, environment, component, status) (rate(ratp_cash_drift_amount_bucket{deployment_environment!="backtest"}[10m])))) > 100
        for: 5m
        labels:
          severity: critical
          category: reconciliation
        annotations:
          summary: Cash drift exceeds critical threshold
          description: Cash reconciliation drift p95 is above 100 USD.
          recommended_action: Review broker/account snapshots and consider trading freeze.
      - alert: RATPEquityDriftCritical
        expr: abs(histogram_quantile(0.95, sum by (le, environment, component, broker, endpoint, status) (rate(ratp_equity_drift_amount_bucket{deployment_environment!="backtest"}[10m])))) > 100
        for: 5m
        labels:
          severity: critical
          category: reconciliation
        annotations:
          summary: Equity drift exceeds critical threshold
          description: Equity reconciliation drift p95 is above 100 USD.
          recommended_action: Review reconciliation report and broker account state.
      - alert: RATPPositionDriftDetected
        expr: sum by (environment, component, status) (increase(ratp_position_drift_count_total{deployment_environment!="backtest"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          category: reconciliation
        annotations:
          summary: Position drift detected
          description: Position reconciliation drift has been observed.
          recommended_action: Inspect reconciliation details and position snapshots.

  - name: ratp-governance-control-alerts
    interval: 30s
    rules:
      - alert: RATPGovernanceCycleFailure
        expr: sum by (environment, component, failure_class) (increase(ratp_governance_cycle_failures_total{deployment_environment!="backtest"}[15m])) > 0
        for: 2m
        labels:
          severity: warning
          category: risk_governance
        annotations:
          summary: Governance automation cycle failed
          description: "Governance cycle failure detected for {{ $labels.component }}."
          recommended_action: Review governance runtime dashboard and audit logs.
      - alert: RATPAllocationCycleFailure
        expr: sum by (environment, component, failure_class) (increase(ratp_allocation_cycle_failures_total{deployment_environment!="backtest"}[15m])) > 0
        for: 2m
        labels:
          severity: warning
          category: risk_governance
          job_name: strategy_allocation_rebalance_cycle
        annotations:
          summary: Allocation rebalance cycle failed
          description: Allocation rebalance automation failed.
          recommended_action: Review allocation decisions and audit logs.
      - alert: RATPMetricExporterMissing
        expr: absent(up{job="otel-collector"}) or up{job="otel-collector"} == 0
        for: 5m
        labels:
          severity: critical
          category: control_infra
          environment: unknown
        annotations:
          summary: OpenTelemetry metric exporter scrape is unavailable
          description: Prometheus cannot scrape the OTel collector metrics endpoint.
          recommended_action: Check otel-collector and LGTM containers.
