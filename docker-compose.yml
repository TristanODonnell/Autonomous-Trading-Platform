services:
  # ----------------------------
  # platform Postgres
  # ----------------------------
  postgres:
    image: postgres:16
    container_name: ratp_postgres
    restart: unless-stopped
    env_file:
      - infra/.env
    ports:
      - "5433:5432"
    volumes:
      - ratp_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratp -d ratp"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ----------------------------
  # Airflow metadata Postgres (separate DB)
  # ----------------------------
  airflow_postgres:
    image: postgres:16
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"  # host 5434-> container 5432 (avoids clashing with ratp_postgres)
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----------------------------
  # Airflow init (one-time)
  # ----------------------------
  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow_init
    depends_on:
      airflow_postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Tristan
      _AIRFLOW_WWW_USER_LASTNAME: ODonnell
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    volumes:
      - ./src/autonomous_trading_platform/scheduler/airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./orchestration/logs:/opt/airflow/logs
      - ./orchestration/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Tristan --lastname ODonnell --role Admin --email admin@example.com || true"
  # ----------------------------
  # Airflow webserver
  # ----------------------------
  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow_postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow/src
    ports:
      - "8080:8080"
    volumes:
      - ./src/autonomous_trading_platform/scheduler/airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./orchestration/logs:/opt/airflow/logs
      - ./orchestration/plugins:/opt/airflow/plugins
    command: webserver

  # ----------------------------
  # Airflow scheduler
  # ----------------------------
  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow_postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./src/autonomous_trading_platform/scheduler/airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./orchestration/logs:/opt/airflow/logs
      - ./orchestration/plugins:/opt/airflow/plugins
    command: scheduler

volumes:
  ratp_pgdata:
  airflow_pgdata:
