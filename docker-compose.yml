# Shared by every service built from the app image (migrate, app, scheduler).
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ratp-app
  env_file:
    - path: .env
      required: false
  environment:
    # Container-side endpoints: .env holds the host-side ones (localhost), which are wrong in here.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ratp}:${POSTGRES_PASSWORD:-ratp_password}@postgres:5432/${POSTGRES_DB:-ratp}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts

services:
  # ----------------------------
  # platform Postgres
  # ----------------------------
  postgres:
    image: postgres:16
    container_name: ratp_postgres
    restart: unless-stopped
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    env_file:
      - infra/.env
    ports:
      - "5433:5432"
    volumes:
      - ratp_pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratp -d ratp"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ----------------------------
  # DB migrations (one-shot; app and scheduler wait for it)
  # ----------------------------
  migrate:
    <<: *app-base
    container_name: ratp_migrate
    restart: "no"
    command: alembic -c infra/db/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------
  # FastAPI REST API
  # ----------------------------
  app:
    <<: *app-base
    container_name: ratp_app
    restart: unless-stopped
    command: uvicorn autonomous_trading_platform.interfaces.rest.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------
  # Scheduler (soak-loop runner: intraday ticks + end-of-day chain)
  # Never run the Airflow overlay's DAGs against the same DB: the no-overlap
  # lock is process-local, so both would execute every cycle.
  # ----------------------------
  scheduler:
    <<: *app-base
    container_name: ratp_scheduler
    restart: unless-stopped
    command: atp runtime soak-loop paper --mode realistic
    # SIGTERM lets the in-flight cycle finish (TRADING_CYCLE_TIMEOUT_SECONDS=300) before SIGKILL
    stop_grace_period: 6m
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ----------------------------
  # Observability (Grafana LGTM)
  # ----------------------------
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: ratp_lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"   # Grafana UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ratp_lgtm_data:/data
      - ./infra/observability/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./infra/observability/prometheus-config.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./infra/observability/prometheus/alerts:/otel-lgtm/alerts:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ----------------------------
  # OpenTelemetry Collector
  # ----------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ratp_otel_collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    restart: unless-stopped

volumes:
  ratp_pgdata:
  ratp_lgtm_data:
