services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratp_app_dev
    command: uvicorn autonomous_trading_platform.interfaces.rest.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
