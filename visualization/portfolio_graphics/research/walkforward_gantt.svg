<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace">
  <style>
    .bg { fill: #070B0F; }
    .title { fill: #C9D1D9; font-size: 16px; font-weight: 700; }
    .hint { fill: #FFFFFF; font-size: 11px; font-style: italic; }
    .axis { stroke: #1C2532; stroke-width: 1; }
    .train-bar { fill: #3B9EFF33; stroke: #3B9EFF; stroke-width: 1.25; rx: 3; }
    .test-bar { fill: #00E5A033; stroke: #00E5A0; stroke-width: 1.25; rx: 3; }
    .fold-label { fill: #8B949E; font-size: 10.5px; }
    .legend-text { fill: #8B949E; font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="420"/>
  <text class="title" x="30" y="34">Walk-forward windows — rolling 365-day train / 90-day test</text>
  <text class="hint" x="30" y="54">9 folds shown schematically; each window rolls forward, overlapping the prior fold</text>

  <line class="axis" x1="30" y1="380" x2="960" y2="380"/>
  <text class="fold-label" x="30" y="398">t0</text>
  <text class="fold-label" x="940" y="398">t0 + ~5.5yr</text>

  <!-- 9 folds, each: 365d train bar + 90d test bar, offset stepping right -->
  <!-- scale: ~14px per 30 days for compactness -->
  <g id="folds">
    <!-- fold 1 -->
    <rect class="train-bar" x="30"  y="60"  width="220" height="14"/>
    <rect class="test-bar"  x="250" y="60"  width="54"  height="14"/>
    <text class="fold-label" x="30" y="52">fold 1</text>
    <!-- fold 2 -->
    <rect class="train-bar" x="70"  y="94"  width="220" height="14"/>
    <rect class="test-bar"  x="290" y="94"  width="54"  height="14"/>
    <text class="fold-label" x="70" y="86">fold 2</text>
    <!-- fold 3 -->
    <rect class="train-bar" x="110" y="128" width="220" height="14"/>
    <rect class="test-bar"  x="330" y="128" width="54"  height="14"/>
    <text class="fold-label" x="110" y="120">fold 3</text>
    <!-- fold 4 -->
    <rect class="train-bar" x="150" y="162" width="220" height="14"/>
    <rect class="test-bar"  x="370" y="162" width="54"  height="14"/>
    <text class="fold-label" x="150" y="154">fold 4</text>
    <!-- fold 5 -->
    <rect class="train-bar" x="190" y="196" width="220" height="14"/>
    <rect class="test-bar"  x="410" y="196" width="54"  height="14"/>
    <text class="fold-label" x="190" y="188">fold 5</text>
    <!-- fold 6 -->
    <rect class="train-bar" x="230" y="230" width="220" height="14"/>
    <rect class="test-bar"  x="450" y="230" width="54"  height="14"/>
    <text class="fold-label" x="230" y="222">fold 6</text>
    <!-- fold 7 -->
    <rect class="train-bar" x="270" y="264" width="220" height="14"/>
    <rect class="test-bar"  x="490" y="264" width="54"  height="14"/>
    <text class="fold-label" x="270" y="256">fold 7</text>
    <!-- fold 8 -->
    <rect class="train-bar" x="310" y="298" width="220" height="14"/>
    <rect class="test-bar"  x="530" y="298" width="54"  height="14"/>
    <text class="fold-label" x="310" y="290">fold 8</text>
    <!-- fold 9 -->
    <rect class="train-bar" x="350" y="332" width="220" height="14"/>
    <rect class="test-bar"  x="570" y="332" width="54"  height="14"/>
    <text class="fold-label" x="350" y="324">fold 9</text>
  </g>

  <g transform="translate(700,80)">
    <rect x="0" y="0" width="18" height="14" class="train-bar"/>
    <text class="legend-text" x="26" y="12">365-day train window</text>
    <rect x="0" y="26" width="18" height="14" class="test-bar"/>
    <text class="legend-text" x="26" y="38">90-day test window (unseen)</text>
    <text class="hint" x="0" y="66">test simulation is skipped entirely</text>
    <text class="hint" x="0" y="80">after a train-window failure</text>
  </g>
</svg>
