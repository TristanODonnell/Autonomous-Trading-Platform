<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace">
  <style>
    .bg { fill: #070B0F; }
    .title { fill: #C9D1D9; font-size: 16px; font-weight: 700; }
    .hint { fill: #FFFFFF; font-size: 11px; font-style: italic; }
    .track { stroke: #1C2532; stroke-width: 8; fill: none; }
    .fill-range { stroke: #00E5A0; stroke-width: 8; fill: none; }
    .fallback-range { stroke: #E8A838; stroke-width: 8; fill: none; }
    .tick { stroke: #4A5568; stroke-width: 1; }
    .tick-label { fill: #8B949E; font-size: 11px; }
    .marker { fill: #FF4D6D; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="260"/>
  <text class="title" x="30" y="34">Slippage calibration — sample-count clamp</text>
  <text class="hint" x="30" y="54">below the minimum sample count, calibration falls back to safe defaults rather than swinging on a handful of fills</text>

  <line class="track" x1="80" y1="140" x2="920" y2="140"/>
  <line class="fallback-range" x1="80" y1="140" x2="320" y2="140"/>
  <line class="fill-range" x1="320" y1="140" x2="920" y2="140"/>

  <line class="tick" x1="320" y1="120" x2="320" y2="160"/>
  <circle class="marker" cx="320" cy="140" r="7"/>
  <text class="tick-label" x="320" y="185" text-anchor="middle" fill="#FF4D6D" font-weight="700">30 samples</text>
  <text class="tick-label" x="320" y="202" text-anchor="middle" fill="#FFFFFF">threshold</text>

  <text class="tick-label" x="80" y="120" text-anchor="start" fill="#E8A838">below 30 → fallback defaults</text>
  <text class="tick-label" x="920" y="120" text-anchor="end" fill="#00E5A0">≥30 → calibrated impact coefficient</text>
</svg>
